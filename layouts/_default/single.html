{{ define "main" }}
  <article>
    <h1>{{ .Title }}</h1>
    {{ with .Description }}<p class="lede">{{ . }}</p>{{ end }}
    {{ with .Date }}<p class="entry-meta"><time datetime="{{ .Format "2006-01-02" }}">{{ .Format "January 2, 2006" }}</time></p>{{ end }}
    {{ with .Content }}{{ . }}{{ end }}
  </article>
{{ end }}
